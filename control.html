<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PontoView Control</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:"Segoe UI",Inter,Arial,sans-serif}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0f14}.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#b9c5d2;font-size:12px;letter-spacing:.03em}.boot[hidden]{display:none}.wx-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(2,6,12,.72);padding:18px}.wx-modal[hidden]{display:none}.wx-card{width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#151c25;border:1px solid #354354;box-shadow:0 24px 80px rgba(0,0,0,.42);color:#edf3f8}.wx-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #2a3543;background:#19222d}.wx-head strong{font-size:13px}.wx-close{border:1px solid #354354;background:#10161e;color:#b9c5d2;border-radius:4px;width:32px;height:30px;cursor:pointer}.wx-body{padding:16px}.wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wx-field{display:block;color:#b9c5d2;font-size:11px;font-weight:600}.wx-field input,.wx-field select,.wx-field textarea{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #354354;border-radius:4px;background:#101720;color:#edf3f8;padding:9px 10px;font:inherit}.wx-field textarea{min-height:112px;resize:vertical}.wx-check{display:flex;gap:8px;align-items:center;margin-top:12px;color:#b9c5d2;font-size:11px}.wx-note{margin:12px 0 0;color:#718196;font-size:10px;line-height:1.5}.wx-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 16px;border-top:1px solid #2a3543;background:#10161e}.wx-btn{height:34px;border:1px solid #354354;border-radius:4px;background:#19222d;color:#edf3f8;padding:0 12px;font-size:10px;font-weight:800;cursor:pointer}.wx-btn.primary{background:#003e8d;border-color:#2377c6}.wx-btn.danger{color:#ff8996;border-color:#7c3a46;background:#351820}.wx-status{margin-right:auto;display:flex;align-items:center;color:#718196;font-size:10px}.wx-status.ok{color:#33c990}.wx-status.error{color:#ff8996}@media(max-width:700px){.wx-grid{grid-template-columns:1fr}.wx-card{width:100%}.wx-actions{flex-wrap:wrap}.wx-status{width:100%;margin-bottom:4px}}
</style>
</head>
<body>
<div id="boot" class="boot">Conectando ao PontoView Studio…</div>
<iframe id="core" title="PontoView Broadcast Graphics Workstation"></iframe>
<div id="weatherModal" class="wx-modal" hidden>
  <section class="wx-card" role="dialog" aria-modal="true" aria-labelledby="wxTitle">
    <div class="wx-head"><strong id="wxTitle">Widget de clima</strong><button id="wxClose" class="wx-close" type="button">×</button></div>
    <div class="wx-body">
      <div class="wx-grid">
        <label class="wx-field">Cidades, uma por linha, até 5<textarea id="wxCities" maxlength="180" placeholder="São Paulo\nRio de Janeiro\nBrasília"></textarea></label>
        <div>
          <label class="wx-field">Posição<select id="wxPosition"><option value="top-left">Superior esquerdo</option><option value="top-right">Superior direito</option><option value="bottom-left">Inferior esquerdo</option><option value="bottom-right">Inferior direito</option></select></label>
          <label class="wx-field" style="margin-top:12px">Layout<select id="wxLayout"><option value="row">Horizontal</option><option value="column">Vertical</option></select></label>
          <label class="wx-field" style="margin-top:12px">Unidade<select id="wxUnit"><option value="celsius">Celsius °C</option><option value="fahrenheit">Fahrenheit °F</option></select></label>
        </div>
      </div>
      <label class="wx-check"><input id="wxVisible" type="checkbox"> Exibir o widget</label>
      <label class="wx-check"><input id="wxHumidity" type="checkbox"> Mostrar umidade</label>
      <label class="wx-check"><input id="wxWind" type="checkbox"> Mostrar vento</label>
      <p class="wx-note">O widget consulta a Open-Meteo diretamente no navegador e pode exibir até cinco cidades. A edição fica em Preview até você aplicar no Program.</p>
    </div>
    <div class="wx-actions"><span id="wxStatus" class="wx-status">Preview independente do Program.</span><button id="wxOut" class="wx-btn danger" type="button">OUT</button><button id="wxSave" class="wx-btn" type="button">SALVAR PVW</button><button id="wxTake" class="wx-btn primary" type="button">APLICAR NO AR</button></div>
  </section>
</div>
<script src="./app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="./js/control-shell.js"></script>
</body>
</html>
