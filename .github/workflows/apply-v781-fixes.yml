name: Apply V7.8.1 targeted fixes

on:
  push:
    branches:
      - fix/output-url-breaking-brand

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/output-url-breaking-brand
      - name: Patch control and overlay
        shell: python
        run: |
          from pathlib import Path

          control = Path('control.html')
          s = control.read_text()
          old = ".monitor-bottom{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-top:1px solid var(--line);background:var(--panel3);font-size:8.5px;color:var(--muted)}.monitor-bottom b{color:var(--text2);font-weight:650}"
          new = old + ".program-output-bar{height:34px;gap:8px}.output-tools{min-width:0;flex:1;display:flex;align-items:center;gap:5px}.output-label{flex:0 0 auto;font-size:8px;font-weight:800;color:var(--muted);white-space:nowrap}.output-url{min-width:0;flex:1!important;width:auto!important;height:24px!important;margin:0!important;padding:0 7px!important;border-radius:3px!important;font-size:8px!important;color:var(--text2)!important;background:var(--field)!important}.output-button{height:24px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);color:var(--text2);padding:0 7px;font-size:7.5px;font-weight:800}.output-button:hover{background:var(--panel)}"
          assert old in s
          s = s.replace(old, new, 1)
          old = '<div class="monitor-bottom"><span>SAÍDA DO OBS</span><b>PGM</b></div>'
          new = '<div class="monitor-bottom program-output-bar"><div class="output-tools"><span class="output-label">SAÍDA</span><input id="overlayUrl" class="output-url" type="url" readonly aria-label="URL do overlay para OBS, vMix ou Browser Source"><button id="copyOverlayUrl" class="output-button" type="button">COPIAR</button><button id="openOverlayUrl" class="output-button" type="button">ABRIR</button></div><b>PGM</b></div>'
          assert old in s
          s = s.replace(old, new, 1)
          old = "breaking:{enabled:false,primary:'#E3182D',dark:'#730913',accent:'#FFD147'}"
          new = "breaking:{enabled:false,primary:'#E3182D',dark:'#730913',accent:'#FFD147',inText:'BREAKING NEWS',outText:''}"
          assert old in s
          s = s.replace(old, new, 1)
          old = '</div><div style="margin-top:12px"><button id="resetTheme" class="secondary-button">Restaurar identidade PontoView</button></div>'
          new = '</div><div class="grid2" style="margin-top:12px"><label class="field">Texto ao entrar no Breaking<input type="text" maxlength="42" data-path="breaking.inText" placeholder="BREAKING NEWS"></label><label class="field">Texto ao sair do Breaking<input type="text" maxlength="42" data-path="breaking.outText" placeholder="Vazio = nome do programa / marca"></label></div><div class="help">O texto de saída pode ser personalizado. Se ficar vazio, o stinger usa automaticamente o nome configurado no Módulo lateral e, como fallback, o texto do Bug / logo.</div><div style="margin-top:12px"><button id="resetTheme" class="secondary-button">Restaurar identidade PontoView</button></div>'
          assert old in s
          s = s.replace(old, new, 1)
          old = "function setUiTheme(t){document.documentElement.dataset.uiTheme=t;try{localStorage.setItem(UI_KEY,t)}catch(_){}$('themeToggle').textContent=t==='dark'?'Tema claro':'Tema escuro'}"
          new = "function overlayOutputUrl(){try{const u=new URL('overlay.html',location.href);u.search='';u.hash='';return u.href}catch(_){return'overlay.html'}}\nfunction syncOverlayOutputUrl(){const el=$('overlayUrl');if(el)el.value=overlayOutputUrl()}\nasync function copyOverlayOutputUrl(){const value=overlayOutputUrl();try{await navigator.clipboard.writeText(value)}catch(_){const el=$('overlayUrl');if(!el)return;el.focus();el.select();try{document.execCommand('copy')}catch(__){}el.setSelectionRange(0,0)}toast('URL do overlay copiada')}\n" + old
          assert old in s
          s = s.replace(old, new, 1)
          old = "$('previewResolution').onchange=e=>setPreviewResolution(e.target.value);$('themeToggle').onclick=()=>setUiTheme(document.documentElement.dataset.uiTheme==='dark'?'light':'dark');"
          new = old + "$('copyOverlayUrl').onclick=copyOverlayOutputUrl;$('openOverlayUrl').onclick=()=>window.open(overlayOutputUrl(),'_blank','noopener,noreferrer');"
          assert old in s
          s = s.replace(old, new, 1)
          old = "renderNav();renderQuick();renderScenes();selectEditor('lowerThird');syncForm();renderPendingState();setTimeout(()=>sendPreview({mode:'sync'}),180);"
          new = "renderNav();renderQuick();renderScenes();selectEditor('lowerThird');syncForm();renderPendingState();syncOverlayOutputUrl();setTimeout(()=>sendPreview({mode:'sync'}),180);"
          assert old in s
          s = s.replace(old, new, 1)
          control.write_text(s)

          overlay = Path('overlay.html')
          o = overlay.read_text()
          old = "breaking:{enabled:false,primary:'#E3182D',dark:'#730913',accent:'#FFD147'}"
          new = "breaking:{enabled:false,primary:'#E3182D',dark:'#730913',accent:'#FFD147',inText:'BREAKING NEWS',outText:''}"
          assert old in o
          o = o.replace(old, new, 1)
          old = "function stinger(on){const el=$('breakingStinger');el.className='';$('stingerText').textContent=on?'BREAKING NEWS':'PONTOVIEW';void el.offsetWidth;el.classList.add(on?'active':'off');setTimeout(()=>el.className='',on?1000:780)}"
          new = "function stinger(on,state=displayState){const el=$('breakingStinger'),b=state.breaking||{},brand=state.module?.brandText||state.bug?.text||'';el.className='';$('stingerText').textContent=on?(b.inText||'BREAKING NEWS'):(b.outText||brand||'');void el.offsetWidth;el.classList.add(on?'active':'off');setTimeout(()=>el.className='',on?1000:780)}"
          assert old in o
          o = o.replace(old, new, 1)
          old = "if(old.breaking.enabled!==next.breaking.enabled)stinger(next.breaking.enabled);"
          new = "if(old.breaking.enabled!==next.breaking.enabled)stinger(next.breaking.enabled,next);"
          assert old in o
          o = o.replace(old, new, 1)
          overlay.write_text(o)
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control.html overlay.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose overlay URL and customize breaking stinger"
          git push origin HEAD:fix/output-url-breaking-brand
