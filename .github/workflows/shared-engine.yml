name: Shared graphics engine
on:
  pull_request:
    paths:
      - 'shared/**'
      - 'tests/**'
      - 'control-core.html'
      - 'overlay-core.html'
      - '.github/workflows/shared-engine.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'tests/**'
      - 'control-core.html'
      - 'overlay-core.html'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: node --check shared/graphics-engine.js && node --check tests/graphics-engine.test.cjs
      - name: Unit tests (no Supabase/network)
        run: node --test tests/graphics-engine.test.cjs
