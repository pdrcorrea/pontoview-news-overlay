<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PontoView Overlay V7.8</title>
<style>
:root{
  --pv-primary:#003E8D;--pv-accent:#87D7FC;--pv-navy:#082B5B;--pv-ink:#101827;--pv-soft:#F1F5F9;
  --breaking-primary:#E3182D;--breaking-dark:#730913;--breaking-accent:#FFD147;
  --safe-x:clamp(28px,3.35vw,72px);--safe-y:clamp(24px,4.8vh,58px);
  --ticker-h:clamp(40px,5.35vh,62px);--module-w:clamp(178px,12.4vw,252px);
  --detail-h:clamp(28px,3.55vh,40px);--body-h:clamp(84px,10.8vh,122px);--support-h:clamp(27px,3.45vh,40px);
  --content-w:calc(100vw - (var(--safe-x)*2));--highlight-h:clamp(80px,10.8vh,120px);--gap:clamp(6px,.7vh,10px);
  --bug-w:clamp(165px,13vw,260px);--bug-h:clamp(62px,8.4vh,96px);
  --motion:cubic-bezier(.2,.76,.2,1);--motion-out:cubic-bezier(.22,.72,.2,1);--layout:cubic-bezier(.22,.72,.2,1);
  --wipe-ms:680ms;--layout-ms:420ms;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:Inter,"SF Pro Display","Segoe UI Variable","Segoe UI",Roboto,Arial,sans-serif;color:var(--pv-ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#viewport,#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.graphic{opacity:0;visibility:hidden;pointer-events:none}.graphic.mounted{opacity:1;visibility:visible}
.safe-guide{display:none;position:absolute;z-index:1000;left:var(--safe-x);right:var(--safe-x);top:var(--safe-y);bottom:calc(var(--ticker-h) + var(--safe-y));border:1px dashed rgba(135,215,252,.8);box-shadow:0 0 0 9999px rgba(0,62,141,.035)}
body.preview.show-safe .safe-guide{display:block}.fit-one{white-space:nowrap;overflow:hidden;text-overflow:clip}

/* Compositor compartilhado: todos os elementos usam a mesma régua */
.anchor-shell{position:absolute;z-index:20;bottom:var(--ticker-h);left:var(--safe-x);right:var(--safe-x);display:flex;flex-direction:column;gap:var(--gap);pointer-events:none;transition:left var(--layout-ms) var(--layout),right var(--layout-ms) var(--layout)}
.anchor-shell[data-anchor="left"]{align-items:flex-start}.anchor-shell[data-anchor="center"]{align-items:center}.anchor-shell[data-anchor="right"]{align-items:flex-end}
.lower-frame{display:flex;align-items:flex-end;width:100%;max-width:100%;min-width:0;transition:width var(--layout-ms) var(--layout),max-width var(--layout-ms) var(--layout)}
.module-column{display:flex;flex-direction:column;flex:0 0 0;width:0;max-width:0;min-width:0;overflow:visible;transition:flex-basis var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout),max-width var(--layout-ms) var(--layout)}
.module-column.active{flex-basis:var(--module-w);width:var(--module-w);max-width:var(--module-w)}
.status-slot{height:0;min-height:0;overflow:visible;transition:height var(--layout-ms) var(--layout),min-height var(--layout-ms) var(--layout)}
.module-body-slot{height:0;min-height:0;overflow:visible;transition:height var(--layout-ms) var(--layout),min-height var(--layout-ms) var(--layout)}
.lower-frame.has-detail .status-slot{height:var(--detail-h);min-height:var(--detail-h)}.lower-frame.has-body .module-body-slot{height:var(--body-h);min-height:var(--body-h)}
.content-column{display:flex;flex-direction:column;flex:0 1 0;width:0;max-width:0;min-width:0;overflow:visible;transition:flex-grow var(--layout-ms) var(--layout),flex-basis var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout),max-width var(--layout-ms) var(--layout)}
.content-column.active{flex:1 1 auto;width:auto;max-width:100%}
.lower-frame.module-and-content .content-column.active{max-width:calc(100% - var(--module-w))}
.detail-strip{display:flex;height:0;min-height:0;min-width:0;overflow:visible;transition:height var(--layout-ms) var(--layout),min-height var(--layout-ms) var(--layout)}
.lower-frame.has-detail .detail-strip{height:var(--detail-h);min-height:var(--detail-h)}
.topic-slot{display:flex;flex:0 1 0;width:0;max-width:0;overflow:visible;transition:flex-basis var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout),max-width var(--layout-ms) var(--layout)}
.topic-slot.active{flex-basis:clamp(130px,17vw,280px);width:clamp(130px,17vw,280px);max-width:34%}
.person-slot{display:flex;flex:0 1 0;width:0;max-width:0;min-width:0;overflow:visible;transition:flex-grow var(--layout-ms) var(--layout),flex-basis var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout),max-width var(--layout-ms) var(--layout)}
.person-slot.active{flex:1 1 340px;width:auto;max-width:100%}.person-slot.active:only-child{flex-basis:100%}
.gc-body-slot{display:flex;height:0;min-height:0;min-width:0;overflow:visible;transition:height var(--layout-ms) var(--layout),min-height var(--layout-ms) var(--layout)}
.lower-frame.has-body .gc-body-slot{height:var(--body-h);min-height:var(--body-h)}
.highlight-slot{display:flex;align-items:flex-end;width:min(52vw,920px);height:0;min-height:0;overflow:visible;transition:height var(--layout-ms) var(--layout),min-height var(--layout-ms) var(--layout),margin-left var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout)}
.anchor-shell.highlight-above .highlight-slot{height:var(--highlight-h);min-height:var(--highlight-h)}
.anchor-shell.highlight-above.has-module-column .highlight-slot{margin-left:var(--module-w)}
.anchor-shell[data-anchor="right"].highlight-above.has-module-column .highlight-slot{margin-left:0;margin-right:0}

/* AO VIVO independente */
#liveTag{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0 clamp(10px,.8vw,15px);background:var(--pv-primary);color:#fff;font-size:clamp(11px,1.02vw,18px);font-weight:850;letter-spacing:.02em;text-transform:uppercase;overflow:hidden;isolation:isolate}
#liveTag.docked-bug{position:absolute;z-index:46;height:var(--detail-h);width:var(--bug-w);transition:left var(--layout-ms) var(--layout),right var(--layout-ms) var(--layout),top var(--layout-ms) var(--layout),bottom var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout)}
#liveTag.docked-bug[data-bug-position^="bottom"]{width:var(--module-w)}
#liveTag.docked-bug[data-bug-position="top-left"]{left:var(--safe-x)}#liveTag.docked-bug[data-bug-position="top-right"]{right:var(--safe-x)}
#liveTag.docked-bug[data-bug-position="top-left"][data-bug-dock="above"],#liveTag.docked-bug[data-bug-position="top-right"][data-bug-dock="above"]{top:var(--safe-y)}
#liveTag.docked-bug[data-bug-position="top-left"][data-bug-dock="below"],#liveTag.docked-bug[data-bug-position="top-right"][data-bug-dock="below"]{top:calc(var(--safe-y) + var(--bug-h))}
#liveTag.docked-bug[data-bug-position="bottom-left"]{left:var(--safe-x)}#liveTag.docked-bug[data-bug-position="bottom-right"]{right:var(--safe-x)}
#liveTag.docked-bug[data-bug-position^="bottom"][data-bug-dock="above"]{bottom:calc(var(--ticker-h) + var(--body-h) - var(--detail-h))}
#liveTag.docked-bug[data-bug-position^="bottom"][data-bug-dock="below"]{bottom:var(--ticker-h)}

/* Módulo lateral: marca + data/hora, sem depender do AO VIVO */
#sideModule{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.17);isolation:isolate}
.module-brand{flex:1;min-height:0;background:rgba(255,255,255,.985);display:flex;align-items:center;justify-content:center;padding:clamp(7px,.9vw,13px);overflow:hidden;border-left:1px solid rgba(8,43,91,.08);transition:background .32s ease,border-color .32s ease,box-shadow .32s ease}
.module-brand.has-image.transparent-logo{background:transparent;border-color:transparent}.module-brand.has-image.transparent-logo img{filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))}
.module-brand img{display:none;max-width:100%;max-height:100%;object-fit:contain}.brand-text{font-size:clamp(17px,1.85vw,33px);font-weight:800;line-height:.93;letter-spacing:-.025em;text-align:center;color:var(--pv-primary);text-transform:uppercase;overflow:hidden;max-width:100%;max-height:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.module-clock{height:var(--support-h);min-height:var(--support-h);flex:0 0 var(--support-h);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px;background:var(--pv-navy);color:#fff;font-size:clamp(10px,.9vw,14px);font-weight:700;letter-spacing:.01em;white-space:nowrap}.module-clock .sep{width:1px;height:42%;background:rgba(255,255,255,.42)}
#sideModule.clock-none .module-clock{display:none}

/* Tag / editoria independente */
#topicBar{position:relative;width:100%;height:100%;display:flex;align-items:center;padding:0 clamp(11px,1vw,18px);background:var(--pv-primary);color:#fff;font-size:clamp(11px,1.02vw,18px);font-weight:850;text-transform:uppercase;white-space:nowrap;overflow:hidden;isolation:isolate}

/* Nome / cargo independente */
#personBar{position:relative;width:100%;height:100%;display:flex;align-items:center;min-width:0;padding:0 clamp(11px,1vw,18px);background:var(--pv-navy);color:#fff;font-size:clamp(10px,.95vw,17px);text-transform:uppercase;white-space:nowrap;overflow:hidden;isolation:isolate}
#personBar .name{font-weight:850;overflow:hidden}#personBar .divider{margin:0 clamp(6px,.55vw,10px);opacity:.55}#personBar .role{font-weight:600;opacity:.95;overflow:hidden}

/* GC principal: somente manchete + apoio */
#lowerThird{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.14);isolation:isolate}
.gc-headline{position:relative;flex:1;min-height:0;display:flex;align-items:center;padding:0 clamp(14px,1.3vw,24px);background:rgba(255,255,255,.99);border-right:clamp(4px,.38vw,7px) solid var(--pv-primary);overflow:hidden}.gc-headline-text{width:100%;font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed",Arial,sans-serif;font-size:clamp(24px,2.35vw,45px);line-height:.96;font-weight:900;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.gc-support{height:var(--support-h);display:flex;align-items:center;padding:0 clamp(14px,1.3vw,24px);background:rgba(244,247,251,.99);border-top:1px solid rgba(17,24,39,.12);border-right:clamp(4px,.38vw,7px) solid var(--pv-primary);font-size:clamp(12px,1.1vw,21px);font-weight:600;white-space:nowrap;overflow:hidden}

/* Destaque */
#highlight{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:visible;filter:drop-shadow(0 10px 20px rgba(0,0,0,.14));isolation:isolate}
#highlight.inline{filter:none}
.highlight-tag{height:clamp(23px,2.8vh,32px);align-self:flex-start;display:flex;align-items:center;padding:0 clamp(10px,.9vw,16px);background:var(--pv-primary);color:#fff;font-size:clamp(10px,.9vw,16px);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden}.highlight-body{flex:1;min-height:0;background:rgba(255,255,255,.99);border-left:clamp(4px,.38vw,7px) solid var(--pv-primary);padding:clamp(8px,1vh,12px) clamp(13px,1.1vw,20px);overflow:hidden;display:flex;flex-direction:column;justify-content:center}.highlight-title{font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-size:clamp(20px,1.8vw,31px);font-weight:900;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden}.highlight-subtitle{margin-top:clamp(2px,.3vh,5px);font-size:clamp(11px,1vw,18px);font-weight:600;white-space:nowrap;overflow:hidden;color:#263244}

/* Ticker */
#ticker{position:absolute;z-index:50;left:0;right:0;bottom:0;height:var(--ticker-h);display:grid;grid-template-columns:var(--safe-x) var(--module-w) minmax(0,1fr) var(--module-w) var(--safe-x);overflow:hidden;box-shadow:0 -4px 16px rgba(0,0,0,.12);isolation:isolate;background:#111820}
.ticker-tag{grid-column:2;display:flex;align-items:center;justify-content:center;padding:0 12px;background:var(--pv-primary);color:#fff;font-size:clamp(11px,1.08vw,18px);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden}.ticker-window{grid-column:3;min-width:0;overflow:hidden;background:#111820;color:#fff;display:flex;align-items:center}.ticker-track{display:inline-block;min-width:max-content;padding-left:100%;font-size:clamp(12px,1.12vw,21px);font-weight:600;white-space:nowrap;animation:tickerMove var(--ticker-duration,24s) linear infinite}.ticker-right{grid-column:4;display:flex;align-items:center;justify-content:center;padding:0 12px;background:#253246;color:#fff;font-size:clamp(10px,.9vw,15px);font-weight:750;white-space:nowrap;overflow:hidden;border-left:1px solid rgba(255,255,255,.08)}@keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* Bug / logo */
#bug{position:absolute;z-index:42;width:var(--bug-w);height:var(--bug-h);display:flex;align-items:center;justify-content:center;transition:left var(--layout-ms) var(--layout),right var(--layout-ms) var(--layout),top var(--layout-ms) var(--layout),bottom var(--layout-ms) var(--layout),width var(--layout-ms) var(--layout),height var(--layout-ms) var(--layout)}
#bug[data-position="top-left"]{left:var(--safe-x);top:var(--safe-y)}#bug[data-position="top-right"]{right:var(--safe-x);top:var(--safe-y)}#bug[data-position="bottom-left"],#bug[data-position="bottom-right"]{width:var(--module-w);height:var(--body-h);bottom:var(--ticker-h)}#bug[data-position="bottom-left"]{left:var(--safe-x)}#bug[data-position="bottom-right"]{right:var(--safe-x)}#bug[data-position^="top"][data-live-dock="above"]{top:calc(var(--safe-y) + var(--detail-h))}#bug[data-position^="bottom"][data-live-dock="above"],#bug[data-position^="bottom"][data-live-dock="below"]{height:calc(var(--body-h) - var(--detail-h))}#bug[data-position^="bottom"][data-live-dock="below"]{bottom:calc(var(--ticker-h) + var(--detail-h))}
.bug-box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(7px,.8vw,14px);background:rgba(255,255,255,.975);border-bottom:clamp(4px,.36vw,7px) solid var(--pv-primary);box-shadow:0 9px 22px rgba(0,0,0,.16);overflow:hidden;transition:background .32s ease,border-color .32s ease,box-shadow .32s ease}.bug-box.has-image.transparent-logo{background:transparent;border-color:transparent;box-shadow:none}.bug-box.has-image.transparent-logo img{filter:drop-shadow(0 2px 5px rgba(0,0,0,.2))}.bug-box img{display:none;max-width:100%;max-height:90%;object-fit:contain}.bug-text{font-size:clamp(17px,1.65vw,29px);font-weight:850;line-height:.95;text-align:center;text-transform:uppercase;color:var(--pv-primary)}#bug[data-position^="bottom"] .bug-box{padding:clamp(10px,1vw,16px)}#bug[data-position^="bottom"] .bug-box img{max-width:84%;max-height:66%;object-position:center}#bug[data-position^="bottom"] .bug-text{max-width:82%;font-size:clamp(16px,1.42vw,25px)}

/* Fullscreen */
#fullscreen{position:absolute;z-index:80;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(125deg,var(--pv-navy),var(--pv-primary));color:#fff;overflow:hidden;isolation:isolate}#fullscreen::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 78% 25%,rgba(135,215,252,.28),transparent 28%),linear-gradient(115deg,transparent 45%,rgba(255,255,255,.06) 45%,rgba(255,255,255,.06) 56%,transparent 56%);transform:rotate(-4deg)}
.fs-card{position:relative;z-index:2;width:min(84vw,1500px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.65fr);gap:clamp(28px,4vw,72px);align-items:center}.fs-card.no-image{grid-template-columns:1fr}.fs-copy{min-width:0}.fs-label{display:inline-flex;background:var(--pv-accent);color:#052b5b;padding:clamp(6px,.7vw,10px) clamp(12px,1.15vw,20px);font-size:clamp(12px,1vw,18px);font-weight:850;text-transform:uppercase;letter-spacing:.04em}.fs-title{margin-top:clamp(16px,2vh,28px);font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-size:clamp(38px,5.2vw,94px);line-height:.9;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.fs-subtitle{margin-top:clamp(16px,2vh,28px);max-width:1100px;font-size:clamp(17px,1.75vw,32px);line-height:1.18;font-weight:500;color:rgba(255,255,255,.92)}.fs-list{margin:clamp(18px,2.4vh,32px) 0 0;padding:0;list-style:none;display:grid;gap:clamp(8px,1vh,14px)}.fs-list li{display:flex;gap:12px;font-size:clamp(17px,1.55vw,29px);font-weight:600}.fs-list li::before{content:"";width:9px;height:9px;margin-top:.55em;border-radius:50%;background:var(--pv-accent);flex:0 0 9px}.fs-image{width:100%;max-height:62vh;object-fit:cover;border:1px solid rgba(255,255,255,.2);box-shadow:0 22px 60px rgba(0,0,0,.28)}#fullscreen[data-mode="breaking"]{background:linear-gradient(125deg,var(--breaking-dark),var(--breaking-primary))}#fullscreen[data-mode="breaking"] .fs-label{background:var(--breaking-accent);color:#3b1700}

/* Wipe de conteúdo */
.wipe-band{position:absolute;z-index:30;top:0;bottom:0;left:0;width:48%;background:var(--pv-primary);opacity:0;pointer-events:none;transform:translateX(-110%);will-change:transform}.updating>.wipe-band,.updating .wipe-band{opacity:1;animation:contentWipe var(--wipe-ms) var(--motion) both}@keyframes contentWipe{0%{transform:translateX(-110%)}100%{transform:translateX(225%)}}

/* IN / OUT V7.8: matriz fixa por tipo de gráfico. O wipe colorido segue exclusivo do UPDATE. */
/* Base horizontal, usada também pelo Fullscreen e pelo bug superior. */
.anim-in{animation:graphicLeftIn .44s var(--motion) both}.anim-out{animation:graphicLeftOut .46s var(--motion-out) both}
.graphic[data-anim-anchor="right"].anim-in{animation-name:graphicRightIn}.graphic[data-anim-anchor="right"].anim-out{animation-name:graphicRightOut}
.graphic[data-anim-anchor="center"].anim-in{animation-name:graphicCenterIn}.graphic[data-anim-anchor="center"].anim-out{animation-name:graphicCenterOut}
@keyframes graphicLeftIn{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0)}}
@keyframes graphicLeftOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes graphicRightIn{0%{clip-path:inset(0 0 0 100%)}100%{clip-path:inset(0)}}
@keyframes graphicRightOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes graphicCenterIn{0%{clip-path:inset(0 50%)}100%{clip-path:inset(0)}}
@keyframes graphicCenterOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 50%)}}

/* Módulo lateral: surge de baixo para cima e recolhe pelo caminho inverso. */
#sideModule.anim-in{animation:moduleVerticalIn .46s var(--motion) both}
#sideModule.anim-out{animation:moduleVerticalOut .46s var(--motion) both}
@keyframes moduleVerticalIn{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0)}}
@keyframes moduleVerticalOut{0%{clip-path:inset(0)}100%{clip-path:inset(100% 0 0 0)}}

/* GC principal, editoria, nome/cargo e Destaque: sempre esquerda -> direita; OUT retorna à esquerda. */
#lowerThird.anim-in,#topicBar.anim-in,#personBar.anim-in,#highlight.anim-in{animation:editorialLeftIn .46s var(--motion) both}
#lowerThird.anim-out,#topicBar.anim-out,#personBar.anim-out,#highlight.anim-out{animation:editorialLeftOut .46s var(--motion-out) both}
@keyframes editorialLeftIn{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0)}}
@keyframes editorialLeftOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 100% 0 0)}}

/* AO VIVO mantém o comportamento aprovado: baixo -> cima e OUT inverso. */
#liveTag.anim-in{animation:liveTagIn .38s var(--motion) both}#liveTag.anim-out{animation:liveTagOut .42s var(--motion-out) both}
@keyframes liveTagIn{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0)}}
@keyframes liveTagOut{0%{clip-path:inset(0)}100%{clip-path:inset(100% 0 0 0)}}

/* Ticker: sobe do rodapé e OUT recolhe novamente para baixo. */
#ticker.anim-in{animation:tickerIn .42s var(--motion) both}#ticker.anim-out{animation:tickerOut .46s var(--motion-out) both}
@keyframes tickerIn{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0)}}
@keyframes tickerOut{0%{clip-path:inset(0)}100%{clip-path:inset(100% 0 0 0)}}

/* Bug: superior mantém wipe lateral; inferior passa a usar a mesma animação vertical do módulo. */
#bug.anim-in{animation:bugLeftIn .38s var(--motion) both}#bug.anim-out{animation:bugLeftOut .42s var(--motion-out) both}
#bug[data-position="top-right"].anim-in{animation-name:bugRightIn}#bug[data-position="top-right"].anim-out{animation-name:bugRightOut}
#bug[data-position^="bottom"].anim-in{animation:bugBottomIn .46s var(--motion) both}
#bug[data-position^="bottom"].anim-out{animation:bugBottomOut .46s var(--motion-out) both}
@keyframes bugLeftIn{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0)}}
@keyframes bugLeftOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes bugRightIn{0%{clip-path:inset(0 0 0 100%)}100%{clip-path:inset(0)}}
@keyframes bugRightOut{0%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes bugBottomIn{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0)}}
@keyframes bugBottomOut{0%{clip-path:inset(0)}100%{clip-path:inset(100% 0 0 0)}}

/* Fullscreen permanece com o efeito anterior. */

function animateIn(key){runAnim(key,'anim-in',IN_MS[key])}
function animateOut(key,done){runAnim(key,'anim-out',OUT_MS[key],done)}
function updateWipe(key,nextConfig,done){const el=$(IDS[key]);clearAnim(key);void el.offsetWidth;el.classList.add('updating');const swap=setTimeout(()=>{displayState[key]=clone(nextConfig);renderAll()},300);const end=setTimeout(()=>{el.classList.remove('updating');updateHandles.delete(key);done&&done()},740);updateHandles.set(key,{swap,end})}
function stinger(on){const el=$('breakingStinger');el.className='';$('stingerText').textContent=on?'BREAKING NEWS':'PONTOVIEW';void el.offsetWidth;el.classList.add(on?'active':'off');setTimeout(()=>el.className='',on?1000:780)}
function transitionElement(key,nextConfig){const was=mounted.has(key),will=!!nextConfig.visible;if(was&&!will){animateOut(key,()=>{mounted.delete(key);displayState[key]=clone(nextConfig);renderAll()});return}if(!was&&will){displayState[key]=clone(nextConfig);mounted.add(key);renderAll();requestAnimationFrame(()=>animateIn(key));return}if(was&&will){updateWipe(key,nextConfig);return}displayState[key]=clone(nextConfig);renderAll()}
function transitionScene(next){const token=++transitionToken;const outs=KEYS.filter(k=>mounted.has(k)&&!next[k].visible);const updates=KEYS.filter(k=>mounted.has(k)&&next[k].visible&&JSON.stringify(displayState[k])!==JSON.stringify(next[k]));const ins=KEYS.filter(k=>!mounted.has(k)&&next[k].visible);let wait=0;outs.forEach(k=>{wait=Math.max(wait,OUT_MS[k]);animateOut(k,()=>{if(token!==transitionToken)return;mounted.delete(k);$(IDS[k]).classList.remove('mounted');displayState[k]=clone(next[k])})});setTimeout(()=>{if(token!==transitionToken)return;outs.forEach(k=>{mounted.delete(k);displayState[k]=clone(next[k])});ins.forEach(k=>{displayState[k]=clone(next[k]);mounted.add(k)});displayState.theme=clone(next.theme);displayState.breaking=clone(next.breaking);renderAll();updates.forEach(k=>updateWipe(k,next[k]));ins.forEach(k=>requestAnimationFrame(()=>animateIn(k)))},wait+60)}
function fullscreenScene(next,old){const entering=!old.fullscreen.visible&&next.fullscreen.visible,leaving=old.fullscreen.visible&&!next.fullscreen.visible;if(!entering&&!leaving){transitionScene(next);return}const token=++transitionToken;if(entering){const active=KEYS.filter(k=>k!=='fullscreen'&&mounted.has(k));let wait=0;active.forEach(k=>{wait=Math.max(wait,OUT_MS[k]);animateOut(k,()=>{if(token!==transitionToken)return;mounted.delete(k);$(IDS[k]).classList.remove('mounted')})});setTimeout(()=>{if(token!==transitionToken)return;active.forEach(k=>mounted.delete(k));displayState=clone(next);mounted.add('fullscreen');KEYS.filter(k=>k!=='fullscreen').forEach(k=>mounted.delete(k));renderAll();requestAnimationFrame(()=>animateIn('fullscreen'))},wait+60)}else{animateOut('fullscreen',()=>{if(token!==transitionToken)return;mounted.delete('fullscreen');displayState=clone(next);KEYS.forEach(k=>{if(next[k].visible)mounted.add(k);else mounted.delete(k)});renderAll();KEYS.filter(k=>k!=='fullscreen'&&next[k].visible).forEach(k=>requestAnimationFrame(()=>animateIn(k)))})}}
function syncState(next){transitionToken++;KEYS.forEach(clearAnim);targetState=clone(next);displayState=clone(next);mounted.clear();KEYS.forEach(k=>{if(next[k].visible)mounted.add(k)});renderAll();refreshClock()}
function applyState(raw,meta={}){const next=merge(clone(DEFAULT),migrateV5(raw||{})),old=clone(targetState);
  const anchorKeys=['lowerThird','module','topicBar','personBar','liveTag'];
  const positionChanged=anchorKeys.some(k=>next[k]?.position!==old[k]?.position);
  // Só uma mudança explícita de posição/cena libera a régua. Toggle/OUT preservam a posição atual.
  if(positionChanged&&(meta.mode==='scene'||meta.mode==='sync'||meta.mode==='take'||meta.mode==='update'))lastCompositionAnchor=null;if(meta.mode==='sync'){syncState(next);return}targetState=clone(next);if(old.breaking.enabled!==next.breaking.enabled)stinger(next.breaking.enabled);displayState.theme=clone(next.theme);displayState.breaking=clone(next.breaking);applyTheme();if(meta.mode==='breaking'||meta.mode==='theme'){renderAll();return}if((meta.mode==='update'||meta.mode==='take'||meta.mode==='toggle'||meta.mode==='out')&&meta.target&&KEYS.includes(meta.target)){transitionElement(meta.target,next[meta.target]);return}fullscreenScene(next,old)}
addEventListener('resize',()=>{renderAll();refreshClock()});setInterval(refreshClock,1000);
function consumeProgramMessage(m){if(!m||m.type!=='PROGRAM')return;if(m.nonce&&m.nonce===lastMessageNonce)return;if(m.nonce)lastMessageNonce=m.nonce;applyState(m.state,m.meta||{})}
if(IS_PREVIEW){addEventListener('message',e=>{if(e.data?.type==='PONTOVIEW_PREVIEW')applyState(e.data.state,e.data.meta||{})})}else{if(bc)bc.onmessage=e=>consumeProgramMessage(e.data);addEventListener('storage',e=>{if(e.key===CHANNEL){try{consumeProgramMessage(JSON.parse(e.newValue))}catch(_){}}})}
renderAll();refreshClock();if(bc&&!IS_PREVIEW)bc.postMessage({type:'OVERLAY_READY',version:'7.8'});
})();
</script>
