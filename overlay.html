<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PontoView Overlay</title>
<link rel="stylesheet" href="./weather/weather-overlay.css?v=20260828-1">
<link rel="stylesheet" href="./weather/weather-visual-v2.css?v=20260828-1">
<link rel="stylesheet" href="./weather/weather-polish-v4.css?v=20260828-1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Inter,"Segoe UI",Arial,sans-serif}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}#weatherLayer{display:none!important}#weather-root{position:fixed;inset:0;z-index:120;pointer-events:none;background:transparent!important}
</style>
</head>
<body>
<iframe id="core" title="PontoView graphics renderer"></iframe>
<div id="weatherLayer" hidden></div>
<div id="weather-root" aria-live="polite"></div>
<script src="./app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
window.PV_SHARED_WEATHER_V2 = true;
(() => {
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : (input?.url || String(input || ''));
    if (window.PV_SHARED_WEATHER_V2 && /(?:api|geocoding-api)\.open-meteo\.com\//i.test(url)) {
      return Promise.reject(new Error('Legacy Weather provider disabled; using PontoView Weather backend.'));
    }
    return nativeFetch(input, init);
  };
})();
</script>
<script src="./js/overlay-shell.js"></script>
<script src="./js/news-weather-v2.js?v=20260828-1"></script>
</body>
</html>
