<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto:wght@400;700;900&family=Oswald:wght@400;700&family=Montserrat:wght@400;700;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--tema:#003366;--texto:#ffffff;--opacity:1;--font-family:'Inter';--font-weight:900;--font-size:2.8vw;--tema-rgb:0,51,102}
  body,html{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;font-family:'Inter',sans-serif;background:transparent}
  #pv-canvas{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5vw 5vh 5vw;box-sizing:border-box}
  #pv-master{display:flex;flex-direction:column;width:90vw}
  .top-row{display:flex;height:4.2vh;margin-bottom:2px}
  #live-label,#tag-top{background:rgba(var(--tema-rgb),var(--opacity));display:flex;align-items:center;clip-path:inset(0 100% 0 0);text-transform:uppercase;font-weight:900}
  #live-label{color:var(--texto);width:10vw;justify-content:center;font-size:1.1vw}
  #tag-top{color:var(--texto);padding:0 1.5vw;margin-left:2px;font-size:1.2vw;flex:1}
  .main-bar{display:flex;margin-bottom:2px}
  #side-block{width:10vw;display:flex;flex-direction:column;clip-path:inset(0 100% 0 0);flex-shrink:0}
  #logo-area{height:8vh;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px;box-sizing:border-box}
  #logo-area img{max-width:100%;max-height:100%;object-fit:contain}
  #logo-area span{font-weight:900;color:#1a1a1a;font-size:1.2vw;text-align:center}
  #time-box{height:4vh;background:rgba(var(--tema-rgb),var(--opacity));color:var(--texto);font-weight:800;font-size:1.3vw;display:flex;align-items:center;justify-content:center}
  #news-content{flex:1;margin-left:2px;display:flex;flex-direction:column;overflow:hidden}

  /* GC principal — ocupa todo o espaço disponível por padrão */
  #headline-wrapper{
    background:white;color:#1a1a1a;padding:0 1.5vw;
    display:flex;align-items:center;
    flex:1;
    clip-path:inset(0 100% 0 0);
    border-right:0.8vw solid var(--tema);
  }
  #main-text{
    font-size:var(--font-size);font-weight:var(--font-weight);
    font-family:var(--font-family),sans-serif;
    text-transform:uppercase;line-height:1.1;
    overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
    word-break:break-word;
  }

  /* Barra de detalhe — começa escondida, cresce para 4vh quando ativa */
  #detail-box{
    background:rgba(var(--tema-rgb),var(--opacity));
    color:var(--texto);
    padding:0 1.5vw;
    font-size:1.3vw;
    display:flex;
    align-items:center;
    overflow:hidden;
    /* altura e opacidade animadas via JS com GSAP */
    height:0;
    opacity:0;
    margin-top:0;
    clip-path:inset(0 100% 0 0);
  }

  #ticker-wrap{width:99%;background:#000;height:4vh;overflow:hidden;display:flex;align-items:center;border-left:1vw solid var(--tema);clip-path:inset(0 100% 0 0);position:relative}
  #ticker-text{white-space:nowrap;color:white;font-size:1.2vw;font-weight:700;position:absolute;will-change:transform}
  .gc-fade-out{animation:gcOut .3s forwards}
  .gc-fade-in{animation:gcIn .4s forwards}
  @keyframes gcOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
  @keyframes gcIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="pv-canvas">
  <div id="pv-master">
    <div class="top-row">
      <div id="live-label">AO VIVO</div>
      <div id="tag-top">---</div>
    </div>
    <div class="main-bar">
      <div id="side-block">
        <div id="logo-area"></div>
        <div id="time-box">00:00</div>
      </div>
      <div id="news-content">
        <div id="headline-wrapper"><div id="main-text">---</div></div>
        <div id="detail-box"></div>
      </div>
    </div>
    <div id="ticker-wrap"><div id="ticker-text">---</div></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://gwawftcyltlmnunttyxj.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3YXdmdGN5bHRsbW51bnR0eXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTU0OTQsImV4cCI6MjA5NDE3MTQ5NH0.ZoglWSlO7Cb37GuG8mIESSGP4z33dh-3uz6nMiwx8uY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const workspaceSlug=params.get('w');
let tickerTween=null,currentStates={},tickerSpeed=100,lastTickerText='';
let clockInterval=null,isFirstLoad=true;
let detailVisible=false;

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function startClock(){
  if(clockInterval)clearInterval(clockInterval);
  clockInterval=setInterval(()=>{
    const n=new Date();
    document.getElementById('time-box').innerText=
      n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
  },1000);
}
startClock();

function startTicker(){
  if(tickerTween)tickerTween.kill();
  const el=document.getElementById('ticker-text');
  const parentW=document.getElementById('ticker-wrap').offsetWidth;
  const selfW=el.offsetWidth;
  if(selfW===0||!currentStates.ticker)return;
  gsap.set(el,{x:parentW});
  tickerTween=gsap.to(el,{x:-selfW,duration:(selfW+parentW)/tickerSpeed,ease:'none',repeat:-1});
}

function animateText(el,newText){
  if(el.innerText===newText)return;
  el.classList.remove('gc-fade-in');
  el.classList.add('gc-fade-out');
  setTimeout(()=>{
    el.innerText=newText;
    el.classList.remove('gc-fade-out');
    el.classList.add('gc-fade-in');
    setTimeout(()=>el.classList.remove('gc-fade-in'),450);
  },300);
}

// Controla a barra de detalhe com GSAP:
// — quando tem texto: cresce para 4vh, adiciona margin-top:2px, mostra clip
// — quando vazio: encolhe para 0, GC principal preenche o espaço automaticamente (flex:1)
function setDetail(text,instant){
  const box=document.getElementById('detail-box');
  const has=typeof text==='string'&&text.trim()!=='';

  if(has===detailVisible&&box.innerText===(has?text:''))return; // sem mudança

  if(has){
    box.innerText=text;
    if(instant){
      gsap.set(box,{height:'4vh',opacity:1,marginTop:'2px',clipPath:'inset(0 0% 0 0)'});
    } else {
      gsap.to(box,{height:'4vh',opacity:1,marginTop:'2px',duration:0.35,ease:'power2.out'});
      // só abre o clip se o GC principal já estiver visível
      if(currentStates.headline){
        gsap.to(box,{clipPath:'inset(0 0% 0 0)',duration:0.45,ease:'power3.out',delay:0.1});
      }
    }
  } else {
    if(instant){
      box.innerText='';
      gsap.set(box,{height:0,opacity:0,marginTop:'0px',clipPath:'inset(0 100% 0 0)'});
    } else {
      gsap.to(box,{
        height:0,opacity:0,marginTop:'0px',duration:0.3,ease:'power2.in',
        onComplete:()=>{
          box.innerText='';
          gsap.set(box,{clipPath:'inset(0 100% 0 0)'});
        }
      });
    }
  }
  detailVisible=has;
}

// Verifica se um elemento GSAP já está totalmente visível (clipPath sem oclusão à direita)
function isVisible(el){
  const x=gsap.getProperty(el,'clipPath');
  // GSAP armazena como string tipo "inset(0px Xpx 0px 0px)" ou "inset(0 0% 0 0)"
  if(!x||x==='none')return true;
  // extrai o segundo valor (right clip)
  const parts=x.replace('inset(','').replace(')','').trim().split(/\s+/);
  if(parts.length<2)return true;
  const right=parseFloat(parts[1]);
  return right<=1; // considera visível se clip direita <= 1px / 1%
}

const WIPE_ELS=['#live-label','#tag-top','#side-block','#headline-wrapper','#detail-box','#ticker-wrap'];

function wipeAndApply(applyFn){
  // coleta apenas os elementos efetivamente visíveis
  const visEls=WIPE_ELS
    .map(s=>document.querySelector(s))
    .filter(el=>el&&isVisible(el));

  const wipeIn=(targets)=>{
    gsap.to(targets,{
      clipPath:'inset(0 0% 0 0)',
      duration:0.55,
      ease:'power3.inOut',
      stagger:0.07
    });
  };

  if(visEls.length===0){
    applyFn();
    // revela somente os que devem aparecer após apply
    setTimeout(()=>{
      const toShow=WIPE_ELS.map(s=>document.querySelector(s)).filter(el=>el&&isVisible(el));
      if(toShow.length)wipeIn(toShow);
    },50);
    return;
  }

  // Wipe out de todos os visíveis
  gsap.to(visEls,{
    clipPath:'inset(0 100% 0 0)',
    duration:0.4,
    ease:'power3.in',
    stagger:0.04,
    onComplete:()=>{
      applyFn(); // troca conteúdo enquanto tudo está oculto
      setTimeout(()=>{
        // após apply, revela os elementos que agora devem estar visíveis
        const toShow=WIPE_ELS.map(s=>document.querySelector(s)).filter(el=>el);
        wipeIn(toShow);
      },60);
    }
  });
}

function applyState(row){
  const {preset_wipe}=row;
  if(preset_wipe){
    wipeAndApply(()=>_applyVisuals(row,true));
    isFirstLoad=false;
    return;
  }
  _applyVisuals(row,false);
  isFirstLoad=false;
}

function _applyVisuals(row,instant){
  const {states,data,colors,logo,show_time,font_family,font_weight,font_size,bar_opacity}=row;
  const root=document.documentElement;

  if(colors){
    root.style.setProperty('--tema',colors.bg||'#003366');
    root.style.setProperty('--texto',colors.txt||'#ffffff');
    root.style.setProperty('--tema-rgb',hexToRgb(colors.bg||'#003366'));
  }
  if(bar_opacity!=null)root.style.setProperty('--opacity',bar_opacity);
  if(font_family)root.style.setProperty('--font-family',`'${font_family}'`);
  if(font_weight)root.style.setProperty('--font-weight',font_weight);
  if(font_size!=null)root.style.setProperty('--font-size',font_size+'vw');

  if(show_time!==undefined){
    document.getElementById('time-box').style.display=show_time?'flex':'none';
    document.getElementById('logo-area').style.height=show_time?'8vh':'12vh';
  }

  if(logo){
    const logoArea=document.getElementById('logo-area');
    if(logo.type==='img'){
      const isImg=/\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(logo.val)||logo.val.startsWith('data:image');
      logoArea.innerHTML=isImg
        ?`<img src="${logo.val}" alt="logo">`
        :`<span>${logo.val}</span>`;
    }else{
      logoArea.innerHTML=`<span>${logo.val||'PONTO VIEW'}</span>`;
    }
  }

  if(data){
    const tagEl=document.getElementById('tag-top');
    const headEl=document.getElementById('main-text');
    const newTag=data.tag||'';
    const newHead=data.headline||'';
    const newDetail=(data.detail||'').trim();
    const newText=data.ticker||'';
    const newSpeed=data.speed||100;

    if(instant||isFirstLoad){
      tagEl.innerText=newTag;
      headEl.innerText=newHead;
    } else {
      animateText(tagEl,newTag);
      animateText(headEl,newHead);
    }

    // Detalhe: só mostra se houver texto não-vazio
    setDetail(newDetail,instant||isFirstLoad);

    const textChanged=lastTickerText!==newText;
    const speedChanged=tickerSpeed!==newSpeed;
    if(textChanged){document.getElementById('ticker-text').innerText=newText;lastTickerText=newText;}
    if(speedChanged)tickerSpeed=newSpeed;
    if((textChanged||speedChanged)&&currentStates.ticker){
      if(tickerTween)tickerTween.kill();
      setTimeout(startTicker,50);
    }
  }

  if(states){
    currentStates=states;
    const cfg={duration:0.55,ease:'power3.inOut'};
    gsap.to('#live-label',    {clipPath:states.live    ?'inset(0 0% 0 0)':'inset(0 100% 0 0)',...cfg});
    gsap.to('#tag-top',       {clipPath:states.tag     ?'inset(0 0% 0 0)':'inset(0 100% 0 0)',...cfg});
    gsap.to('#side-block',    {clipPath:states.side    ?'inset(0 0% 0 0)':'inset(0 100% 0 0)',...cfg});
    gsap.to('#headline-wrapper',{clipPath:states.headline?'inset(0 0% 0 0)':'inset(0 100% 0 0)',...cfg});

    // detalhe só fica com clip aberto se GC estiver ativo e tiver texto
    if(!states.headline){
      gsap.to('#detail-box',{clipPath:'inset(0 100% 0 0)',...cfg});
    } else if(detailVisible){
      gsap.to('#detail-box',{clipPath:'inset(0 0% 0 0)',...cfg});
    }

    gsap.to('#ticker-wrap',{
      clipPath:states.ticker?'inset(0 0% 0 0)':'inset(0 100% 0 0)',...cfg,
      onComplete:()=>{
        if(states.ticker){if(!tickerTween||tickerTween.killed)startTicker();}
        else{if(tickerTween){tickerTween.kill();tickerTween=null;}}
      }
    });
  }
}

async function init(){
  if(!workspaceSlug){
    document.body.style.background='#111';
    document.body.innerHTML='<p style="color:#f85149;font-family:sans-serif;padding:20px">URL inválida. Use: overlay.html?w=SEU_WORKSPACE</p>';
    return;
  }
  const {data:ws}=await sb.from('workspaces').select('id').eq('slug',workspaceSlug).single();
  if(!ws)return;
  const workspaceId=ws.id;
  const {data:state}=await sb.from('overlay_state').select('*').eq('workspace_id',workspaceId).single();
  if(state)applyState(state);

  const pingChannel=sb.channel('ctrl_'+workspaceId);
  pingChannel.subscribe(()=>{
    setInterval(()=>pingChannel.send({type:'broadcast',event:'ping',payload:{}}),5000);
  });

  sb.channel('overlay_'+workspaceId)
    .on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'overlay_state',filter:`workspace_id=eq.${workspaceId}`},
      (payload)=>applyState(payload.new)
    )
    .subscribe();
}
init();
</script>
</body>
</html>
