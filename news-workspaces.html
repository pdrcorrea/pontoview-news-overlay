<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView News · Canais e programas</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#151c25;--panel2:#19222d;--line:#2a3543;--line2:#354354;--text:#edf3f8;--muted:#8190a3;--brand:#003e8d;--accent:#87d7fc;--danger:#ff8996}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#111820}.brand{display:flex;align-items:center;gap:12px}.brand img{width:132px;max-height:30px;object-fit:contain}.brand span{padding-left:12px;border-left:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}.back{border:1px solid var(--line2);background:var(--panel);color:var(--text);height:34px;padding:0 12px;border-radius:4px;cursor:pointer}.wrap{width:min(1100px,calc(100% - 28px));margin:34px auto}.hero{margin-bottom:24px}.kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.12em}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);background:var(--panel)}.head{height:48px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:space-between}.head strong{font-size:12px}.head small{font-size:9px;color:var(--muted)}.body{padding:12px}.list{display:grid;gap:6px;min-height:80px}.entity{width:100%;border:1px solid var(--line);background:#10161e;color:var(--text);padding:10px 11px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer}.entity:hover,.entity.active{border-color:#337ec1;background:#10283b}.entity b{display:block;font-size:11px}.entity small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.entity span{color:var(--accent);font-size:10px;font-weight:900}.empty{border:1px dashed var(--line2);padding:14px;color:var(--muted);font-size:10px}.form{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:7px}.input{height:36px;border:1px solid var(--line2);background:#101720;color:var(--text);padding:0 9px;border-radius:3px;outline:none}.input:focus{border-color:#337ec1}.btn{height:36px;border:1px solid #2575be;background:var(--brand);color:#fff;padding:0 12px;border-radius:3px;font-size:9px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.open{margin-top:16px;display:flex;justify-content:flex-end}.open .btn{height:42px;padding:0 18px}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:10px}.msg.error{color:var(--danger)}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wrap{margin-top:22px}.hero h1{font-size:23px}.top{padding:0 12px}.brand span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="./assets/PontoViewBranco.png" alt="PontoView"><span>NEWS · CANAIS E PROGRAMAS</span></div><button class="back" type="button" onclick="location.href='./studio.html'">Voltar ao Studio</button></header>
<main class="wrap">
<section class="hero"><span class="kicker">PONTOVIEW NEWS</span><h1>Escolha o canal e o programa.</h1><p>Cada combinação opera sua própria sessão e possui uma URL de saída exclusiva.</p></section>
<div class="grid">
<section class="panel"><div class="head"><strong>Canais / Workspaces</strong><small>isolados por conta</small></div><div class="body"><div id="workspaceList" class="list"></div><div class="form"><input id="workspaceName" class="input" placeholder="Nome do canal"><input id="workspaceSlug" class="input" placeholder="slug-do-canal"><button id="createWorkspace" class="btn" type="button">CRIAR</button></div></div></section>
<section class="panel"><div class="head"><strong>Programas</strong><small id="selectedWorkspaceLabel">selecione um canal</small></div><div class="body"><div id="programList" class="list"><div class="empty">Selecione um canal para carregar os programas.</div></div><div class="form"><input id="programName" class="input" placeholder="Nome do programa"><input id="programSlug" class="input" placeholder="slug-do-programa"><button id="createProgram" class="btn" type="button" disabled>CRIAR</button></div></div></section>
</div>
<div id="message" class="msg"></div><div class="open"><button id="openControl" class="btn" type="button" disabled>ABRIR CONTROLE</button></div>
</main>
<script src="./app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const cfg=window.PV_CONFIG||{}, $=id=>document.getElementById(id), qs=new URLSearchParams(location.search);
let sb=null,user=null,workspaces=[],programs=[],workspace=null,program=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
function msg(text='',error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
function renderWorkspaces(){const host=$('workspaceList');host.innerHTML=workspaces.length?workspaces.map(w=>`<button class="entity${workspace?.id===w.id?' active':''}" data-id="${w.id}" type="button"><div><b>${esc(w.name)}</b><small>/${esc(w.slug)}</small></div><span>ABRIR</span></button>`).join(''):'<div class="empty">Nenhum canal News criado.</div>';host.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>selectWorkspace(workspaces.find(w=>w.id===el.dataset.id)));}
function renderPrograms(){const host=$('programList');$('selectedWorkspaceLabel').textContent=workspace?workspace.name:'selecione um canal';$('createProgram').disabled=!workspace;if(!workspace){host.innerHTML='<div class="empty">Selecione um canal para carregar os programas.</div>';return;}host.innerHTML=programs.length?programs.map(p=>`<button class="entity${program?.id===p.id?' active':''}" data-id="${p.id}" type="button"><div><b>${esc(p.name)}</b><small>/${esc(p.slug)}</small></div><span>SELECIONAR</span></button>`).join(''):'<div class="empty">Nenhum programa neste canal.</div>';host.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{program=programs.find(p=>p.id===el.dataset.id);renderPrograms();syncOpen();});syncOpen();}
function syncOpen(){$('openControl').disabled=!(workspace&&program)}
async function loadWorkspaces(){const {data,error}=await sb.from('workspaces').select('id,name,slug,created_at').eq('user_id',user.id).eq('product','news_overlay').order('created_at');if(error)throw error;workspaces=data||[];renderWorkspaces();const requested=qs.get('workspace');if(requested){const found=workspaces.find(w=>w.id===requested);if(found)await selectWorkspace(found);}else if(workspaces.length===1)await selectWorkspace(workspaces[0]);}
async function selectWorkspace(w){workspace=w;program=null;programs=[];renderWorkspaces();renderPrograms();const {data,error}=await sb.from('programs').select('id,name,slug,created_at').eq('workspace_id',w.id).order('created_at');if(error)return msg(error.message,true);programs=data||[];const requested=qs.get('program');program=requested?programs.find(p=>p.id===requested):null;if(!program&&programs.length===1)program=programs[0];renderPrograms();}
async function createWorkspace(){const name=$('workspaceName').value.trim(), desired=slug($('workspaceSlug').value||name);if(!name||!desired)return msg('Informe nome e slug do canal.',true);const {data,error}=await sb.from('workspaces').insert({user_id:user.id,product:'news_overlay',name,slug:desired}).select('id,name,slug,created_at').single();if(error)return msg(error.message,true);$('workspaceName').value='';$('workspaceSlug').value='';workspaces.push(data);await selectWorkspace(data);msg('Canal criado.');}
async function createProgram(){if(!workspace)return;const name=$('programName').value.trim(), desired=slug($('programSlug').value||name);if(!name||!desired)return msg('Informe o nome do programa.',true);const {data,error}=await sb.from('programs').insert({workspace_id:workspace.id,name,slug:desired,default_template:'lower_third',settings:{product:'news_overlay'}}).select('id,name,slug,created_at').single();if(error)return msg(error.message,true);$('programName').value='';$('programSlug').value='';programs.push(data);program=data;renderPrograms();msg('Programa criado.');}
$('workspaceName').addEventListener('input',()=>{if(!$('workspaceSlug').dataset.edited)$('workspaceSlug').value=slug($('workspaceName').value)});$('workspaceSlug').addEventListener('input',()=>{$('workspaceSlug').dataset.edited='1'});$('programName').addEventListener('input',()=>{if(!$('programSlug').dataset.edited)$('programSlug').value=slug($('programName').value)});$('programSlug').addEventListener('input',()=>{$('programSlug').dataset.edited='1'});
$('createWorkspace').onclick=createWorkspace;$('createProgram').onclick=createProgram;$('openControl').onclick=()=>{if(workspace&&program)location.href=`./control.html?workspace=${encodeURIComponent(workspace.id)}&program=${encodeURIComponent(program.id)}`;};
(async()=>{try{if(!window.supabase?.createClient||!cfg.supabaseUrl||!cfg.supabaseKey)throw new Error('Configuração do Supabase indisponível.');sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('./studio.html');return;}user=session.user;await loadWorkspaces();}catch(e){msg(e?.message||String(e),true);}})();
})();
</script>
</body>
</html>
