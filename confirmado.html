<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>E-mail confirmado | PontoView Studio</title>
  <link rel="icon" href="./assets/favicon.png" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13233a;background:#f5f7fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 10%,#e7efff 0,transparent 34%),#f5f7fa}
    .card{width:min(520px,100%);background:#fff;border:1px solid #dfe5ed;border-radius:22px;padding:38px;box-shadow:0 24px 70px rgba(17,45,80,.10);text-align:center}
    .brand{height:34px;max-width:180px;object-fit:contain;margin-bottom:28px}.icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#eaf1ff;color:#0b5ee7;font-size:32px;font-weight:800}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#0b5ee7}h1{margin:10px 0 12px;font-size:30px;letter-spacing:-.03em}p{margin:0;color:#627086;line-height:1.65}.actions{display:grid;gap:10px;margin-top:28px}.btn{display:flex;justify-content:center;align-items:center;min-height:46px;padding:0 18px;border-radius:11px;text-decoration:none;font-weight:750}.primary{background:#0b5ee7;color:#fff}.secondary{border:1px solid #d8e0ea;color:#17365d;background:#fff}.foot{margin-top:24px;font-size:12px} .foot a{color:#46617f}
  </style>
</head>
<body>
  <main class="card">
    <img class="brand" src="./assets/PontoViewAzul.png" alt="PontoView" />
    <div class="icon" aria-hidden="true">✓</div>
    <span class="eyebrow">Conta PontoView · Studio</span>
    <h1>E-mail confirmado.</h1>
    <p>Sua Conta PontoView foi confirmada com sucesso. Você já pode continuar para o PontoView Studio e entrar com o mesmo e-mail e senha.</p>
    <div class="actions">
      <a class="btn primary" href="./studio.html">Continuar para o PontoView Studio</a>
      <a class="btn secondary" href="https://pontoview.com.br">Conhecer o ecossistema PontoView</a>
    </div>
    <p class="foot"><a href="https://pontoview.com.br/privacidade">Central de Privacidade PontoView</a></p>
  </main>
</body>
</html>
