<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Free Lower Thirds · Overlay</title>
<style>
:root{--accent:#2f6bff;--bg:#11151b;--text:#fff;--font:Inter,Arial,sans-serif;--scale:1;--bottom:7%;--in:450ms;--out:350ms}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:var(--font);color:var(--text)}
#stage{position:fixed;inset:0;pointer-events:none}.graphic{position:absolute;inset:0}.lt{position:absolute;left:5.2%;bottom:var(--bottom);transform-origin:left bottom;transform:scale(var(--scale))}.graphic.right .lt{left:auto;right:5.2%;transform-origin:right bottom}.graphic.hidden .lt{opacity:0;visibility:hidden}.graphic:not(.hidden) .lt{opacity:1;visibility:visible}
.classic .lt{display:flex;align-items:stretch;max-width:74%}.classic.right .lt{flex-direction:row-reverse}.classic .mark{width:72px;min-height:72px;background:var(--accent);display:grid;place-items:center;border-radius:10px 0 0 10px}.classic.right .mark{border-radius:0 10px 10px 0}.classic .mark:after{content:"PV";font-size:20px;font-weight:950;letter-spacing:-1px}.classic .copy{min-width:330px;background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid #ffffff18;border-left:0;padding:11px 18px 12px;border-radius:0 10px 10px 0;box-shadow:0 10px 24px rgba(0,0,0,.24)}.classic.right .copy{border-left:1px solid #ffffff18;border-right:0;border-radius:10px 0 0 10px;text-align:right}.tag{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--accent);margin-bottom:4px}.name{font-size:25px;font-weight:900;line-height:1.04}.role{font-size:14px;opacity:.72;margin-top:5px}
.accent .lt{width:min(560px,72%)}.accent.right .lt{text-align:right}.accent .rail{height:5px;background:var(--accent)}.accent .body{background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid #ffffff18;border-top:0;padding:13px 16px 14px;border-radius:0 0 8px 8px;box-shadow:0 10px 24px rgba(0,0,0,.24)}.accent .tag{display:inline-block;background:var(--accent);color:#fff;padding:4px 7px;border-radius:4px}.accent .name{font-size:27px}
.tagstyle .lt{display:flex;align-items:flex-end;gap:8px}.tagstyle.right .lt{flex-direction:row-reverse;text-align:right}.tagstyle .vtag{align-self:stretch;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:10px;font-weight:900;letter-spacing:.1em;writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 8px;border-radius:7px}.tagstyle.right .vtag{transform:none}.tagstyle .card{background:var(--bg);color:var(--text);padding:12px 17px 13px;border-radius:8px;min-width:330px;border-bottom:4px solid var(--accent);box-shadow:0 10px 24px rgba(0,0,0,.24)}.tagstyle .name{font-size:24px}.tagstyle .role{opacity:.7}
.pill .lt{max-width:72%}.pill.right .lt{text-align:right}.pill .pillname{display:inline-block;background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid #ffffff1c;border-radius:999px;padding:9px 16px 9px 12px;font-size:22px;font-weight:850;backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(0,0,0,.22)}.pill .pillname:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}.pill .roleline{display:flex;align-items:center;gap:9px;margin-top:7px;padding-left:13px}.pill.right .roleline{justify-content:flex-end;padding-left:0;padding-right:13px}.pill .roleline .tag{font-size:9px;margin:0}.pill .roleline .role{margin:0}
.graphic.enter.wipe:not(.right) .lt{animation:wipeL var(--in) cubic-bezier(.2,.8,.2,1) both}.graphic.enter.wipe.right .lt{animation:wipeR var(--in) cubic-bezier(.2,.8,.2,1) both}.graphic.enter.slide:not(.right) .lt{animation:slideL var(--in) cubic-bezier(.2,.8,.2,1) both}.graphic.enter.slide.right .lt{animation:slideR var(--in) cubic-bezier(.2,.8,.2,1) both}.graphic.enter.fade .lt{animation:fadeIn var(--in) ease both}.graphic.enter.pop .lt{animation:popIn var(--in) cubic-bezier(.2,.9,.2,1.2) both}
.graphic.exit.wipe:not(.right) .lt{animation:wipeLOut var(--out) cubic-bezier(.4,0,.8,.2) both}.graphic.exit.wipe.right .lt{animation:wipeROut var(--out) cubic-bezier(.4,0,.8,.2) both}.graphic.exit.slide:not(.right) .lt{animation:slideLOut var(--out) cubic-bezier(.4,0,.8,.2) both}.graphic.exit.slide.right .lt{animation:slideROut var(--out) cubic-bezier(.4,0,.8,.2) both}.graphic.exit.fade .lt{animation:fadeOut var(--out) ease both}.graphic.exit.pop .lt{animation:popOut var(--out) cubic-bezier(.4,0,.8,.2) both}
@keyframes wipeL{from{clip-path:inset(0 100% 0 0);transform:translateX(-18px) scale(var(--scale))}to{clip-path:inset(0);transform:scale(var(--scale))}}@keyframes wipeR{from{clip-path:inset(0 0 0 100%);transform:translateX(18px) scale(var(--scale))}to{clip-path:inset(0);transform:scale(var(--scale))}}@keyframes wipeLOut{from{clip-path:inset(0);transform:scale(var(--scale))}to{clip-path:inset(0 100% 0 0);transform:translateX(-18px) scale(var(--scale))}}@keyframes wipeROut{from{clip-path:inset(0);transform:scale(var(--scale))}to{clip-path:inset(0 0 0 100%);transform:translateX(18px) scale(var(--scale))}}@keyframes slideL{from{opacity:0;transform:translateX(-55px) scale(var(--scale))}to{opacity:1;transform:scale(var(--scale))}}@keyframes slideR{from{opacity:0;transform:translateX(55px) scale(var(--scale))}to{opacity:1;transform:scale(var(--scale))}}@keyframes slideLOut{from{opacity:1;transform:scale(var(--scale))}to{opacity:0;transform:translateX(-55px) scale(var(--scale))}}@keyframes slideROut{from{opacity:1;transform:scale(var(--scale))}to{opacity:0;transform:translateX(55px) scale(var(--scale))}}@keyframes fadeIn{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}@keyframes fadeOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(5px)}}@keyframes popIn{from{opacity:0;transform:translateY(15px) scale(calc(var(--scale)*.94))}to{opacity:1;transform:scale(var(--scale))}}@keyframes popOut{from{opacity:1;transform:scale(var(--scale))}to{opacity:0;transform:translateY(15px) scale(calc(var(--scale)*.94))}}
</style>
</head>
<body><div id="stage"></div>
<script>
(() => {
const KEY='pontoview-free-lt-manager-v4', CHANNEL=KEY;const bc='BroadcastChannel' in window?new BroadcastChannel(CHANNEL):null;const stage=document.getElementById('stage');let lastId=null,lastVisible=false,lastSnapshot='',hideTimer=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function template(it){const n=esc(it.name||''),r=esc(it.role||''),t=esc(it.tag||'');if(it.style==='accent')return `<div class="lt"><div class="rail"></div><div class="body">${t?`<div class="tag">${t}</div>`:''}<div class="name">${n}</div><div class="role">${r}</div></div></div>`;if(it.style==='tag')return `<div class="lt">${t?`<div class="vtag">${t}</div>`:''}<div class="card"><div class="name">${n}</div><div class="role">${r}</div></div></div>`;if(it.style==='pill')return `<div class="lt"><div class="pillname">${n}</div><div class="roleline">${t?`<div class="tag">${t}</div>`:''}<div class="role">${r}</div></div></div>`;return `<div class="lt"><div class="mark"></div><div class="copy">${t?`<div class="tag">${t}</div>`:''}<div class="name">${n}</div><div class="role">${r}</div></div></div>`}
function applyVars(root,s,it){const g=s.global||{},side=it.side||g.side||'left';root.classList.toggle('right',side==='right');root.style.setProperty('--accent',it.accent||'#2f6bff');root.style.setProperty('--bg',it.bg||'#11151b');root.style.setProperty('--text',it.text||'#fff');root.style.setProperty('--font',g.font||'Inter,Arial,sans-serif');root.style.setProperty('--scale',((it.scale??g.scale??100)/100));root.style.setProperty('--bottom',(it.bottom??g.bottom??7)+'%');root.style.setProperty('--in',(g.inDuration||450)+'ms');root.style.setProperty('--out',(g.outDuration||350)+'ms')}
function build(s,it,visible){const g=s.global||{},styleClass=it.style==='tag'?'tagstyle':(it.style||'classic');const side=it.side||g.side||'left';stage.innerHTML=`<div class="graphic ${styleClass} ${side==='right'?'right':''} ${it.animation||'wipe'} ${visible?'':'hidden'}">${template(it)}</div>`;const root=stage.firstElementChild;applyVars(root,s,it);lastId=it.id;lastSnapshot=JSON.stringify(it);return root}
function render(s){if(!s)return;const it=s.live;if(!it){clearTimeout(hideTimer);stage.innerHTML='';lastId=null;lastVisible=false;lastSnapshot='';return}const snapshot=JSON.stringify(it),changed=lastId!==it.id||lastSnapshot!==snapshot;let root=stage.firstElementChild;if(changed||!root){root=build(s,it,!!s.visible);if(s.visible){root.classList.add('enter');void root.offsetWidth}lastVisible=!!s.visible;return}applyVars(root,s,it);clearTimeout(hideTimer);if(s.visible&&!lastVisible){root.classList.remove('hidden','exit');void root.offsetWidth;root.classList.add('enter')}else if(!s.visible&&lastVisible){root.classList.remove('enter','hidden');void root.offsetWidth;root.classList.add('exit');const ms=(s.global?.outDuration||350)+40;hideTimer=setTimeout(()=>{root.classList.remove('exit');root.classList.add('hidden')},ms)}lastVisible=!!s.visible}
render(load());bc&&(bc.onmessage=e=>render(e.data));addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)try{render(JSON.parse(e.newValue))}catch{}});
})();
</script></body></html>
