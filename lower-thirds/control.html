<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Studio · Free Lower Thirds</title>
<style>
:root{--bg:#0d1016;--panel:#151922;--panel2:#1b202a;--line:#2a313d;--line2:#343d4b;--text:#f4f7fb;--muted:#97a2b2;--blue:#2f6bff;--green:#1fa971;--red:#df4c55;--amber:#d59b37}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;font-weight:950;letter-spacing:-1px}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line2);background:#222834;color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:800}.btn:hover{background:#2a3240}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.green{background:var(--green);border-color:var(--green)}.btn.red{background:var(--red);border-color:var(--red)}.btn.icon{padding:8px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#121720;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#c6ced9}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6e7683;margin-right:7px}.notice.on .live-dot{background:var(--green);box-shadow:0 0 0 4px #1fa97120}.url{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0 9px}.toolbar h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#cbd3df;margin:0}.count{color:var(--muted);font-size:11px}.cards{display:flex;flex-direction:column;gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.card.is-live{border-color:#2e8d6a;box-shadow:0 0 0 1px #1fa9712a inset}.card-main{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px}.drag{width:32px;height:42px;border-radius:7px;background:#10141b;border:1px solid #252c37;display:grid;place-items:center;color:#657184;font-size:17px}.identity{min-width:0}.identity strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity span{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;height:20px;border-radius:5px;background:#222936;border:1px solid #303949;padding:0 6px;font-size:9px;font-weight:800;color:#cbd4df;text-transform:uppercase;letter-spacing:.05em}.swatch{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.card-actions{display:flex;gap:6px;align-items:center}.card-actions .btn{padding:8px 10px}.card-actions .show{background:#216c50;border-color:#287b5d}.card-actions .hide{background:#71353b;border-color:#834047}.card-actions .edit{background:#252c37}.card-actions .more{color:#9aa7b7}
.editor{display:none;border-top:1px solid var(--line);background:#11151c;padding:12px}.card.open .editor{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.span2{grid-column:span 2}.span4{grid-column:span 4}.field label{display:block;color:#9eabba;font-size:10px;font-weight:700;margin:0 0 5px}.field input,.field select{width:100%;height:36px;background:#0d1117;color:#fff;border:1px solid #303846;border-radius:7px;padding:0 9px;outline:none}.field input[type="color"]{padding:3px}.field input:focus,.field select:focus{border-color:#5577b8}.editor-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid #242b35}.danger-link{background:transparent;border:0;color:#e1787d;font-size:11px;font-weight:700;margin-right:auto}
.global{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:14px}.global summary{list-style:none;padding:12px 14px;cursor:pointer;font-size:12px;font-weight:800;display:flex;justify-content:space-between}.global summary::-webkit-details-marker{display:none}.global .body{border-top:1px solid var(--line);padding:12px}.hint{font-size:11px;line-height:1.45;color:var(--muted);margin-top:9px}.empty{border:1px dashed var(--line2);border-radius:10px;padding:28px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#eef3fa;color:#111722;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.app{padding:10px}.topbar{align-items:flex-start}.top-actions .btn span{display:none}.url{display:none}.notice{position:sticky;top:0;z-index:20}.card-main{grid-template-columns:minmax(0,1fr)}.drag{display:none}.card-actions{display:grid;grid-template-columns:1fr 1fr 44px}.card-actions .edit{grid-column:span 2}.grid{grid-template-columns:1fr 1fr}.span2,.span4{grid-column:span 2}.identity{padding-right:3px}.btn{min-height:38px}.toolbar{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">PV</div><div><strong>PontoView Studio</strong><small>Free Lower Thirds · controlador local</small></div></div>
    <div class="top-actions">
      <button class="btn primary" id="newBtn">＋ <span>Novo lower third</span></button>
      <button class="btn" id="openOverlay">↗ <span>Abrir overlay</span></button>
      <button class="btn" id="copyUrl">⧉ <span>Copiar URL</span></button>
    </div>
  </header>
  <div class="notice" id="liveNotice"><div><span class="live-dot"></span><strong id="liveLabel">Nenhum lower third no ar</strong></div><div class="url" id="overlayUrl"></div></div>
  <div class="toolbar"><h2>Lower thirds</h2><div class="count" id="count"></div></div>
  <section class="cards" id="cards"></section>
  <details class="global" id="globalPanel"><summary><span>Configurações globais</span><span>⌄</span></summary><div class="body"><div class="grid"><div class="field span2"><label>Fonte</label><select id="gFont"><option value="Inter,Arial,sans-serif">Inter / Sistema</option><option value="Arial,sans-serif">Arial</option><option value="'Arial Narrow',Arial,sans-serif">Arial Narrow</option><option value="Georgia,serif">Georgia</option><option value="Verdana,sans-serif">Verdana</option></select></div><div class="field"><label>Escala geral</label><input id="gScale" type="number" min="60" max="150" step="5"></div><div class="field"><label>Margem inferior (%)</label><input id="gBottom" type="number" min="1" max="30" step="1"></div><div class="field span2"><label>Posição padrão</label><select id="gSide"><option value="left">Inferior esquerda</option><option value="right">Inferior direita</option></select></div><div class="field"><label>Duração entrada (ms)</label><input id="gIn" type="number" min="100" max="3000" step="50"></div><div class="field"><label>Duração saída (ms)</label><input id="gOut" type="number" min="100" max="3000" step="50"></div></div><div class="editor-actions"><button class="btn" id="resetGlobal">Restaurar padrões</button><button class="btn primary" id="saveGlobal">Salvar configurações</button></div><div class="hint">As configurações globais funcionam como padrão. Cada item pode sobrescrever estilo, cor, posição, escala e animação individualmente.</div></div></details>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
const KEY='pontoview-free-lt-manager-v4';
const CHANNEL='pontoview-free-lt-manager-v4';
const bc='BroadcastChannel' in window?new BroadcastChannel(CHANNEL):null;
const DEFAULT_GLOBAL={font:'Inter,Arial,sans-serif',scale:100,bottom:7,side:'left',inDuration:450,outDuration:350};
const STYLES={classic:'Classic Bar',accent:'Accent Line',tag:'Tag Plate',pill:'Minimal Pill'};
const ANIMS={wipe:'Wipe',slide:'Slide',fade:'Fade',pop:'Pop'};
const seed=[];
function uid(){return 'lt_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.items))return x}catch{}return {items:seed,global:{...DEFAULT_GLOBAL},live:null,visible:false}}
let state=load();state.global={...DEFAULT_GLOBAL,...state.global};if(!state.inheritPositionV3){state.items=state.items.map(x=>({...x,side:'',scale:null,bottom:null}));state.inheritPositionV3=true}
const $=s=>document.querySelector(s), cards=$('#cards');
function persist(push=true){localStorage.setItem(KEY,JSON.stringify(state));if(push)bc?.postMessage(state);renderStatus()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  $('#count').textContent=`${state.items.length} ${state.items.length===1?'item':'itens'}`;
  if(!state.items.length){cards.innerHTML='<div class="empty">Nenhum lower third criado.<br><br><button class="btn primary" onclick="document.querySelector(\'#newBtn\').click()">＋ Criar primeiro</button></div>';renderStatus();return}
  cards.innerHTML=state.items.map(it=>`<article class="card ${state.visible&&state.live?.id===it.id?'is-live':''}" data-id="${it.id}"><div class="card-main"><div class="drag">⋮⋮</div><div class="identity"><strong>${esc(it.name||'Sem nome')}</strong><span>${esc(it.role||'Sem informação secundária')}</span><div class="meta"><span class="chip"><i class="swatch" style="background:${esc(it.accent)}"></i>${esc(STYLES[it.style]||it.style)}</span>${it.tag?`<span class="chip">${esc(it.tag)}</span>`:''}${state.visible&&state.live?.id===it.id?'<span class="chip">● NO AR</span>':''}</div></div><div class="card-actions"><button class="btn show" data-act="show">SHOW</button><button class="btn hide" data-act="hide">HIDE</button><button class="btn edit" data-act="edit">EDITAR</button><button class="btn more" data-act="duplicate" title="Duplicar">⧉</button></div></div><div class="editor"><div class="grid"><div class="field span2"><label>Nome / texto principal</label><input data-f="name" value="${esc(it.name)}"></div><div class="field span2"><label>Cargo / informação secundária</label><input data-f="role" value="${esc(it.role)}"></div><div class="field"><label>Tag</label><input data-f="tag" value="${esc(it.tag||'')}"></div><div class="field"><label>Estilo</label><select data-f="style">${Object.entries(STYLES).map(([v,l])=>`<option value="${v}" ${it.style===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Animação</label><select data-f="animation">${Object.entries(ANIMS).map(([v,l])=>`<option value="${v}" ${it.animation===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Posição</label><select data-f="side"><option value="" ${!it.side?'selected':''}>Padrão global</option><option value="left" ${it.side==='left'?'selected':''}>Esquerda</option><option value="right" ${it.side==='right'?'selected':''}>Direita</option></select></div><div class="field"><label>Cor destaque</label><input data-f="accent" type="color" value="${esc(it.accent)}"></div><div class="field"><label>Cor fundo</label><input data-f="bg" type="color" value="${esc(it.bg)}"></div><div class="field"><label>Cor texto</label><input data-f="text" type="color" value="${esc(it.text)}"></div><div class="field"><label>Escala (%)</label><input data-f="scale" type="number" min="60" max="150" step="5" placeholder="Global: ${state.global.scale}" value="${it.scale??''}"></div><div class="field"><label>Margem inferior (%)</label><input data-f="bottom" type="number" min="1" max="30" step="1" placeholder="Global: ${state.global.bottom}" value="${it.bottom??''}"></div></div><div class="editor-actions"><button class="danger-link" data-act="delete">Excluir lower third</button><button class="btn" data-act="cancel">Fechar</button><button class="btn primary" data-act="save">Salvar alterações</button></div></div></article>`).join('');renderStatus();
}
function renderStatus(){const n=$('#liveNotice'),l=$('#liveLabel');if(state.visible&&state.live){n.classList.add('on');l.textContent=`No ar: ${state.live.name||'Lower third'}`}else{n.classList.remove('on');l.textContent='Nenhum lower third no ar'}const u=new URL('overlay.html',location.href);$('#overlayUrl').textContent=u.href}
function item(id){return state.items.find(x=>x.id===id)}
function show(id){const it=item(id);if(!it)return;state.live=structuredClone(it);state.visible=true;persist();render();toast('Lower third no ar')}
function hide(){state.visible=false;persist();render();toast('Lower third ocultado')}
function readCard(card,it){card.querySelectorAll('[data-f]').forEach(el=>{let v=el.value;if(el.type==='number')v=v===''?null:Number(v);it[el.dataset.f]=v})}
cards.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const card=b.closest('.card');if(!card)return;const id=card.dataset.id,it=item(id),act=b.dataset.act;if(act==='show')return show(id);if(act==='hide')return hide();if(act==='edit'){card.classList.toggle('open');return}if(act==='cancel'){card.classList.remove('open');return}if(act==='save'){readCard(card,it);if(state.visible&&state.live?.id===id)state.live=structuredClone(it);persist();render();toast('Alterações salvas');return}if(act==='duplicate'){const copy={...structuredClone(it),id:uid(),name:(it.name||'Lower third')+' · cópia'};state.items.splice(state.items.indexOf(it)+1,0,copy);persist();render();toast('Lower third duplicado');return}if(act==='delete'){if(!confirm(`Excluir “${it.name||'este lower third'}”?`))return;state.items=state.items.filter(x=>x.id!==id);if(state.live?.id===id){state.live=null;state.visible=false}persist();render();toast('Lower third excluído')}});
$('#newBtn').onclick=()=>{const n={id:uid(),name:'Novo lower third',role:'Cargo ou informação',tag:'',style:'classic',accent:'#2f6bff',bg:'#11151b',text:'#ffffff',side:'',scale:null,bottom:null,animation:'wipe'};state.items.unshift(n);persist();render();setTimeout(()=>document.querySelector(`[data-id="${n.id}"]`)?.classList.add('open'),0);toast('Novo item criado')};
const overlayURL=()=>new URL('overlay.html',location.href).href;$('#openOverlay').onclick=()=>window.open(overlayURL(),'_blank');$('#copyUrl').onclick=async()=>{try{await navigator.clipboard.writeText(overlayURL());toast('URL do overlay copiada')}catch{prompt('Copie a URL do overlay:',overlayURL())}};
function fillGlobal(){const g=state.global;$('#gFont').value=g.font;$('#gScale').value=g.scale;$('#gBottom').value=g.bottom;$('#gSide').value=g.side;$('#gIn').value=g.inDuration;$('#gOut').value=g.outDuration}
$('#saveGlobal').onclick=()=>{state.global={font:$('#gFont').value,scale:Number($('#gScale').value),bottom:Number($('#gBottom').value),side:$('#gSide').value,inDuration:Number($('#gIn').value),outDuration:Number($('#gOut').value)};persist();toast('Configurações globais salvas')};$('#resetGlobal').onclick=()=>{state.global={...DEFAULT_GLOBAL};fillGlobal();persist();toast('Padrões restaurados')};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);render()}catch{}}});fillGlobal();persist(false);render();
})();
</script>
</body>
</html>
